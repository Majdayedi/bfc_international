name: Build, push and deploy Docker images
on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  DOCKERHUB_USER: majdayedi
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./bfc-backend/bfc
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/bfc-backend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/bfc-backend:${{ github.sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./bfc-front
          push: true
          build-args: |
            VITE_API_URL=https://internationalbfc.com
          tags: |
            ${{ env.DOCKERHUB_USER }}/bfc-frontend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/bfc-frontend:${{ github.sha }}
  # Auto-deploy to the server. Opt-in: set the repository variable
  # DEPLOY_ENABLED=true and the three DEPLOY_* secrets. Until then you can
  # deploy manually on the server:
  #   docker compose -f docker-compose.prod.yml up -d --pull always
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Docker images on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /opt/bfc
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker image prune -f
