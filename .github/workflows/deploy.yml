name: Build, push and deploy Docker images

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  DOCKERHUB_USER: majdayedi
  IMAGE_TAG: latest

jobs:
   build:
    name: Build and Push Images
    runs-on: ubuntu-24.04
    environment: bfc-international
    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================
      # 2. VERIFY DOCKER HUB USERNAME
      # ==========================================
      - name: Verify Docker Hub Username
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "=========================================="
          echo "Checking Docker Hub username..."
          echo "=========================================="

          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error title=Docker Hub Username Missing::DOCKERHUB_USERNAME secret is empty or not configured."
            exit 1
          fi

          if [ "$DOCKERHUB_USERNAME" != "${{ env.DOCKERHUB_USER }}" ]; then
            echo "::error title=Docker Hub Username Mismatch::"
            echo "The GitHub secret DOCKERHUB_USERNAME does not match the configured Docker Hub username."
            echo "Expected username: ${{ env.DOCKERHUB_USER }}"
            exit 1
          fi

          echo "✓ DOCKERHUB_USERNAME exists"
          echo "✓ Username is correct: $DOCKERHUB_USERNAME"


      # ==========================================
      # 3. VERIFY DOCKER HUB TOKEN
      # ==========================================
      - name: Verify Docker Hub Token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "=========================================="
          echo "Checking Docker Hub token..."
          echo "=========================================="

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error title=Docker Hub Token Missing::DOCKERHUB_TOKEN secret is empty or not configured."
            exit 1
          fi

          echo "✓ DOCKERHUB_TOKEN exists"
          echo "✓ Token is present"
          echo "✓ Token length: ${#DOCKERHUB_TOKEN} characters"

          # NEVER print the actual token


      # ==========================================
      # 4. SET UP DOCKER BUILDX
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # ==========================================
      # 5. LOGIN TO DOCKER HUB
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================
      # 6. VERIFY DOCKER LOGIN
      # ==========================================
      - name: Verify Docker Login
        run: |
          echo "=========================================="
          echo "Verifying Docker Hub authentication..."
          echo "=========================================="

          docker info > /dev/null 2>&1

          if [ $? -eq 0 ]; then
            echo "✓ Docker is running"
          else
            echo "::error::Docker is not available"
            exit 1
          fi

          echo "✓ Docker Hub login step completed"


      # ==========================================
      # 7. BUILD & PUSH BACKEND
      # ==========================================
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./bfc-backend/bfc
          push: true

          tags: |
            ${{ env.DOCKERHUB_USER }}/bfc-backend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/bfc-backend:${{ github.sha }}


      # ==========================================
      # 8. BUILD & PUSH FRONTEND
      # ==========================================
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./bfc-consulting-innovation

          push: true

          build-args: |
            VITE_API_URL=https://internationalbfc.com

          tags: |
            ${{ env.DOCKERHUB_USER }}/bfc-frontend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/bfc-frontend:${{ github.sha }}

  # Auto-deploy to the server. Opt-in: set the repository variable
  # DEPLOY_ENABLED=true and the three DEPLOY_* secrets. Until then you can
  # deploy manually on the server:
  #   docker compose -f docker-compose.prod.yml up -d --pull always
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin ${{ github.ref_name }}
            docker compose -f docker-compose.prod.yml up -d --pull always

      - name: Smoke test the translation endpoint
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            for i in $(seq 1 10); do
              RESULT=$(curl -s -X POST http://127.0.0.1:8085/api/translate \
                -H "Content-Type: application/json" \
                -d '{"texts":["Health check"],"to":"fr","from":"en"}' || true)
              echo "$RESULT" | grep -q '"configured":true' && {
                echo "Translation provider OK: $RESULT"; exit 0; }
              echo "Waiting for backend/LibreTranslate ($i/10)..."
              sleep 15
            done
            echo "::error::Translation provider did not come up after deploy"
            exit 1
