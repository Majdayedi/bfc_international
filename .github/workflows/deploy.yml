name: Build and push Docker images

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  DOCKERHUB_USER: majdayedi
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN repository secrets are missing or empty. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./bfc-backend/bfc
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/bfc-backend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/bfc-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./bfc-consulting-innovation
          push: true
          build-args: |
            VITE_API_URL=https://internationalbfc.com
          tags: |
            ${{ env.DOCKERHUB_USER }}/bfc-frontend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/bfc-frontend:${{ github.sha }}
