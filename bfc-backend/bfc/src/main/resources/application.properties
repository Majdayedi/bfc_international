# ========================================
# Application Name
# ========================================
spring.application.name=bfc

# ========================================
# Active Profile (default: dev)
# ========================================
# spring.profiles.active=d ev
server.port=8085

# ========================================
# MySQL Database Configuration
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/bfc_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ========================================
# File Upload Configuration
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Custom upload directory (absolute or relative to project)
app.file.upload-dir=uploads

# ========================================
# Spring Security Configuration
# ========================================
# JWT Configuration
app.jwt.secret=bfcAppSecretKey2026VeryLongAndSecureRandomSecretKeyMustBeAtLeast256BitsLongForHS256
app.jwt.expiration-ms=86400000

# CORS allowed origins (comma-separated)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:3001,http://localhost:3002

# ========================================
# Swagger / OpenAPI Configuration
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=bfc.bfc.controller
springdoc.paths-to-match=/api/**

# ========================================
# Logging
# ========================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.bfc.bfc=DEBUG

# Enable error messages in JSON responses
server.error.include-message=always

# ========================================
# Azure AI Translator (dynamic content translation)
# F0 free tier = 2M characters/month, permanent.
# Create a "Translator" resource at portal.azure.com and fill these in.
# ========================================
app.azure.translator.key=${AZURE_TRANSLATOR_KEY:}
app.azure.translator.region=${AZURE_TRANSLATOR_REGION:}
app.azure.translator.endpoint=${AZURE_TRANSLATOR_ENDPOINT:https://api.cognitive.microsofttranslator.com}

# Self-hosted LibreTranslate fallback (unlimited free, no signup).
# Run locally with: pip install libretranslate && libretranslate --load-only en,fr,ar,es
# When no AZURE_TRANSLATOR_KEY is present, the backend automatically uses it.
# NOTE: 127.0.0.1 explicitly — 'localhost' can resolve to a dead IPv6 socket in Java.
app.translation.libretranslate.url=${LIBRETRANSLATE_URL:http://127.0.0.1:5000}
