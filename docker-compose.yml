# BFC production stack: frontend (nginx) + backend (Spring) + MySQL + LibreTranslate.
#
# Usage:
#   1. cp .env.example .env   and fill in the values
#   2. docker compose up -d --build
#
# The frontend is the only public entry point (port 80). The backend port is
# published for API access; LibreTranslate stays on the internal network
# only — visitors must go through your backend, never straight to it.

services:
  db:
    image: mysql:8
    container_name: bfc-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bfc_db
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: bfc-libretranslate
    # First start downloads the language models (~1-2 GB) — this is one-time.
    environment:
      - LT_LOAD_ONLY=en,fr,ar,es
      - LT_UPDATE_MODELS=true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    volumes:
      - lt-models:/home/libretranslate/.local/share/argos-translate
    # NOTE: deliberately no "ports:" — internal network only. The backend
    # reaches it as http://libretranslate:5000.
    restart: unless-stopped

  backend:
    build:
      context: ./bfc-backend/bfc
    container_name: bfc-backend
    environment:
      # Spring relaxed binding: overrides application.properties values.
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/bfc_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - APP_JWT_SECRET=${JWT_SECRET}
      # CORS: the public origin(s) browsers will actually call from.
      - APP_CORS_ALLOWED_ORIGINS=${PUBLIC_SITE_URL},http://localhost:3001
      # LibreTranslate via container DNS on the internal network.
      - LIBRETRANSLATE_URL=http://libretranslate:5000
      # Azure stays optional: if you add AZURE_TRANSLATOR_KEY/REGION later,
      # it takes priority over LibreTranslate automatically.
      - AZURE_TRANSLATOR_KEY=${AZURE_TRANSLATOR_KEY:-}
      - AZURE_TRANSLATOR_REGION=${AZURE_TRANSLATOR_REGION:-}
    ports:
      - "${BACKEND_PORT:-8085}:8085"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      libretranslate:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./bfc-consulting-innovation
      args:
        # Baked into the JS bundle at build time — must be the PUBLIC URL of
        # the API that visitors' browsers can reach, NOT a container name.
        VITE_API_URL: ${PUBLIC_API_URL}
    container_name: bfc-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  lt-models:
  uploads:
